name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Tests
        run: python -m pytest
      - name: Compile Python sources
        run: python -m compileall -q src scripts tests
      - name: Smoke-test installed CLI
        run: code-search search examples "СформироватьНазначениеПлатежа"

  package:
    name: Build and smoke-test distribution
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          code-search search examples "СформироватьНазначениеПлатежа"
      - uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/
