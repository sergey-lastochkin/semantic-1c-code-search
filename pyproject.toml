[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "1c-semantic-code-search"
version = "0.1.0"
description = "Offline-first BSL retrieval engineering demo."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<0.35",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29", "ruff>=0.12,<1"]
embeddings = ["sentence-transformers>=2.6,<4"]
qdrant = ["qdrant-client>=1.9,<2"]
faiss = ["faiss-cpu>=1.8,<2", "numpy>=1.26,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
[project.scripts]
code-search = "code_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
